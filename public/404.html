<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot 11 Enjoy</title>
    <script>
      const path = window.location.pathname
      const base = '/spot11/'
      if (path.startsWith(base)) {
        const route = path.slice(base.length)
        window.location.replace(`${base}?route=/${route}${window.location.search}${window.location.hash}`)
      }
    </script>
  </head>
  <body>Redirecting to Spot 11 Enjoy...</body>
</html>
